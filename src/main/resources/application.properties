# Tons Backend
spring.application.name=Tons Backend
server.servlet.context-path=/api

tons.cnpj=${TONS_CNPJ:27228085000116}

# DataSource
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tonsDb}?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# JWT
jwt.validity=${JWT_VALIDITY:3600}
jwt.secret=${JWT_SECRET}
jwt.resetSecret=${JWT_RESET_SECRET}
jwt.resetValidity=${JWT_RESET_VALIDITY:1800}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
jwt.resetSenhaUrl=${RESET_SENHA_URL:${frontend.base-url}/login/reset-senha?token=}

# WhatsApp Business
whatsapp.api.url=${WHATSAPP_API_URL:https://graph.facebook.com/v25.0}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN}

# Cloudinary
cloudinary.url=${CLOUDINARY_URL}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
broker.exchange.name=tons.notificacoes
broker.queue.name=tons.email.solicitado.v1
broker.routing-key=email.solicitado.v1
