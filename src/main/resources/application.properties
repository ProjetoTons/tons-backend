# Tons Backend
spring.application.name=Tons Backend

tons.cnpj=${TONS_CNPJ:27228085000116}

# DataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tonsDb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# JWT
jwt.validity=${JWT_VALIDITY:3600}
jwt.secret=${JWT_SECRET}
jwt.resetSecret=${JWT_RESET_SECRET}
jwt.resetValidity=${JWT_RESET_VALIDITY:1800}
jwt.resetSenhaUrl=${RESET_SENHA_URL:http://localhost:5173/login/reset-senha?token=}

# Mail / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# WhatsApp Business
whatsapp.api.url=${WHATSAPP_API_URL:https://graph.facebook.com/v25.0}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN}

# Cloudinary
cloudinary.url=${CLOUDINARY_URL}
